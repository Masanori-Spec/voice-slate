name: Official USTX selective-cleanup feasibility
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Bounded independent prototype tests
        run: |
          python3 -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r requirements.txt
          python3 -m unittest discover -s tests -v
          bash -n scripts/hosted_native_gate.sh
      - name: Official release writer, prevalidation deserializer and native reopen
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash scripts/hosted_native_gate.sh 2>&1 | tee evidence/native.log
      - name: Retain source-only native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-slate-native-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
